<!doctype html>
<meta charset="utf-8">
<title>Blockbuster banner</title>
<style>
  @font-face { font-family: "Hanken"; font-weight: 100 900; src: url("../../node_modules/@fontsource-variable/hanken-grotesk/files/hanken-grotesk-latin-wght-normal.woff2") format("woff2-variations"); }
  @font-face { font-family: "Mono"; font-weight: 100 800; src: url("../../node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2-variations"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1800px; height: 860px; overflow: hidden; background: #0a0a0b; font-family: Hanken, system-ui, sans-serif; color: #f2f2f3; }
  .stage { position: relative; width: 1800px; height: 860px;
    background:
      radial-gradient(900px 620px at 1180px 430px, rgba(255, 122, 69, 0.20), transparent 70%),
      radial-gradient(1200px 800px at 0% 100%, rgba(255, 255, 255, 0.04), transparent 60%),
      #0a0a0b; }

  /* The wall: the app icon's blocks, scaled up. Some are blocked, one has left. */
  .wall { position: absolute; left: 36px; top: 40px; display: grid; grid-template-columns: repeat(8, 82px); gap: 16px; }
  .b { width: 82px; height: 82px; border-radius: 18px; background: linear-gradient(#26262a, #1b1b1e); border: 1px solid rgba(255,255,255,0.06); display: grid; place-items: center; }
  .b.x::after { content: ""; width: 26px; height: 26px; background:
      linear-gradient(45deg, transparent 46%, rgba(255,127,119,0.55) 46% 54%, transparent 54%),
      linear-gradient(-45deg, transparent 46%, rgba(255,127,119,0.55) 46% 54%, transparent 54%); }
  .b.gap { background: none; border: 2px dashed rgba(255,255,255,0.16); }
  .b.dim { opacity: 0.45; }

  /* Scrim so the headline reads over the wall. */
  .scrim { position: absolute; inset: 0; background:
      linear-gradient(90deg, rgba(10,10,11,0.0) 0, rgba(10,10,11,0.0) 8%, rgba(10,10,11,0.86) 22%, rgba(10,10,11,0.86) 42%, rgba(10,10,11,0) 62%),
      linear-gradient(0deg, rgba(10,10,11,0.9) 0, rgba(10,10,11,0) 55%); }

  h1 { position: absolute; left: 92px; top: 400px; font-size: 104px; line-height: 0.98; letter-spacing: -0.035em; font-weight: 750; }
  h1 em { font-style: normal; color: #4fd1a1; }
  .sub { position: absolute; left: 96px; top: 640px; width: 560px; font-size: 27px; line-height: 1.4; color: #aeaeb8; }
  .tag { position: absolute; left: 96px; top: 750px; display: flex; gap: 10px; font-family: Mono, monospace; font-size: 16px; color: #8a8a93; }
  .tag span { padding: 7px 11px; border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; }

  /* The escaping block, from the icon. */
  .escape { position: absolute; left: 790px; top: 40px; width: 150px; height: 150px; }
  .trail { position: absolute; inset: 0; width: 1800px; height: 860px; pointer-events: none; }

  .card { position: absolute; border-radius: 20px; overflow: hidden; border: 1px solid rgba(255,255,255,0.14); box-shadow: 0 40px 90px -10px rgba(0,0,0,0.85), 0 0 0 1px rgba(0,0,0,0.4); }
  .card img { display: block; width: 100%; }
  .back { left: 1180px; top: 56px; width: 640px; opacity: 0.8; }
  .main { left: 690px; top: 214px; width: 1000px; }

  /* Blocked on one side, loading on the other. */
  .chips { position: absolute; left: 330px; top: 196px; display: grid; gap: 14px; }
  .chip { display: flex; align-items: center; gap: 12px; width: 300px; padding: 13px 16px; border-radius: 12px; background: rgba(24,24,27,0.94); border: 1px solid rgba(255,255,255,0.1); font-family: Mono, monospace; font-size: 20px; box-shadow: 0 16px 40px -8px rgba(0,0,0,0.7); }
  .chip i { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-weight: 800; font-size: 15px; color: #0a0a0b; }
  .chip.bad i { background: #ff7f77; }
  .chip.ok i { background: #4fd1a1; }
  .chip small { margin-left: auto; font-family: Hanken, sans-serif; font-size: 14px; color: #8a8a93; }
</style>
<div class="stage">
  <div class="wall" id="wall"></div>
  <div class="scrim"></div>

  <svg class="trail" viewBox="0 0 1800 860" fill="none" stroke="#FF7A45" stroke-linecap="round">
    <line x1="708" y1="92" x2="748" y2="98" stroke-width="9" opacity="0.5"/>
    <line x1="722" y1="116" x2="768" y2="118" stroke-width="7" opacity="0.32"/>
    <line x1="706" y1="68" x2="744" y2="74" stroke-width="6" opacity="0.28"/>
  </svg>

  <svg class="escape" viewBox="0 0 150 150" fill="none">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9466"/><stop offset="1" stop-color="#E85A2A"/></linearGradient></defs>
    <g transform="rotate(-18 75 75)">
      <rect x="21" y="21" width="108" height="108" rx="20" fill="url(#g)"/>
      <rect x="31" y="31" width="40" height="15" rx="7.5" fill="#fff" opacity="0.22"/>
      <path d="M62 21 L75 55 L50 77 L81 129" stroke="#B8431B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </svg>

  <div class="card back"><img src="src/wizard.png" alt=""></div>
  <div class="card main"><img src="src/home.png" alt=""></div>

  <div class="chips">
    <div class="chip bad"><i>x</i>discord.com<small>blocked</small></div>
    <div class="chip bad"><i>x</i>youtube.com<small>blocked</small></div>
    <div class="chip ok"><i>&#10003;</i>signal.org<small>loads</small></div>
  </div>

  <h1>Blocked sites<br><em>load.</em></h1>
  <p class="sub">Find what works on your network, keep it running, and never open a terminal.</p>
  <div class="tag"><span>zapret2</span><span>Linux</span><span>Windows</span><span>FreeBSD</span><span>OpenBSD</span></div>
</div>
<script>
  // 8 x 5 blocks; a few blocked, one gone (the one that escaped).
  const blocked = new Set([2, 5, 9, 14, 17, 22, 27, 30, 34]);
  const dim = new Set([0, 1, 8, 16, 24, 32, 3, 11]);
  const w = document.getElementById("wall");
  for (let i = 0; i < 40; i++) {
    const d = document.createElement("div");
    d.className = "b" + (blocked.has(i) ? " x" : "") + (i === 6 ? " gap" : "") + (dim.has(i) ? " dim" : "");
    w.appendChild(d);
  }
</script>
