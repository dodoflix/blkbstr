name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here publishes anything.
permissions:
  contents: read

# A new push makes the previous run irrelevant. Without this they queue up and each one costs a
# full Tauri build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Everything that does not need the system webview. This is where all the tests live, so it is
  # the job that actually tells us whether the code works — kept free of `apt` so a slow package
  # mirror cannot stop it reporting.
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p blkbstr-core -p blkbstr-daemon --all-targets -- -D warnings
      - run: cargo test -p blkbstr-core -p blkbstr-daemon

      - run: npm ci
      - run: npm run build

  # The GUI crate links against the platform webview, so this one needs system packages on Linux.
  app:
    strategy:
      fail-fast: false
      matrix:
        # Target platforms only. macOS is not one: upstream has no macOS engine, so a build there
        # would prove nothing we ship. The BSDs have no hosted runner.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        # webkit2gtk pulls in gstreamer and a lot else, and azure.archive.ubuntu.com has served
        # it at ~40 kB/s: 6 minutes for 42 packages, measured. Generous bound so normal slowness
        # passes, but still bounded so a genuine hang fails instead of occupying a runner.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The GUI crate needs a frontend build to embed.
      - run: npm run build

      - run: cargo clippy -p blkbstr --all-targets -- -D warnings
      - run: cargo test -p blkbstr
