name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here publishes anything.
permissions:
  contents: read

# A new push makes the previous run irrelevant. Without this they queue up and each one costs a
# full Tauri build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The portable crates. No system packages, so this reports quickly whatever the package mirrors
  # are doing — and it holds every test.
  #
  # Both platforms, because `blkbstr-daemon` has `#[cfg(unix)]` / `#[cfg(not(unix))]` branches for
  # the socket: the Windows named-pipe path is only compiled by the Windows leg.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p blkbstr-core -p blkbstr-daemon --all-targets -- -D warnings
      - run: cargo test -p blkbstr-core -p blkbstr-daemon

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # The GUI crate links against the platform webview, so this is the only job needing system
  # packages, and the only one that covers `-p blkbstr`.
  app:
    strategy:
      fail-fast: false
      matrix:
        # Target platforms only. macOS is not one: upstream has no macOS engine, so a build there
        # would prove nothing we ship. The BSDs have no hosted runner.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        # webkit2gtk pulls in gstreamer and a lot else, and azure.archive.ubuntu.com has served
        # it at ~40 kB/s: 6 minutes for 42 packages, measured. Generous bound so normal slowness
        # passes, but still bounded so a genuine hang fails instead of occupying a runner.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri embeds the built frontend, so it has to exist before the crate is compiled.
      - run: npm run build

      - run: cargo clippy -p blkbstr --all-targets -- -D warnings
      - run: cargo test -p blkbstr

  # Neither cargo nor npm can check the packaging, and a broken LSM profile is worse than none: it
  # is loaded by hand, on a machine whoever wrote it is not sitting at.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Installer scripts parse
        run: sh -n packaging/linux/install.sh && sh -n packaging/linux/uninstall.sh

      - name: systemd unit parses
        run: |
          out=$(systemd-analyze verify packaging/linux/blkbstrd.service 2>&1 || true)
          # The daemon is not installed on a runner; that complaint is the only expected one.
          # systemd ignores a directive it does not understand and still exits 0, so the output is
          # what has to be checked.
          noise=$(printf '%s\n' "$out" | grep -v 'is not executable' || true)
          [ -z "$noise" ] || { printf '%s\n' "$noise"; exit 1; }

      - name: Profiles agree with the installer on where the daemon lives
        run: |
          libexec=$(sed -n 's/^LIBEXEC=//p' packaging/linux/install.sh)
          grep -q "$libexec" packaging/linux/apparmor/usr.local.libexec.blkbstrd
          grep -q "$libexec" packaging/linux/selinux/blkbstr.fc

      - name: AppArmor profile parses
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 apparmor
          # -Q parses and compiles without loading; the runner's kernel is not ours to reconfigure.
          apparmor_parser -Q -K packaging/linux/apparmor/usr.local.libexec.blkbstrd

      - name: SELinux module links against the targeted policy
        # In a Fedora container because that is where SELinux users are, and because linking is
        # what catches an interface or type that does not exist — compiling alone does not.
        run: |
          docker run --rm -v "$PWD/packaging/linux/selinux:/policy:ro" fedora:41 sh -c '
            set -eu
            dnf -q -y install selinux-policy-devel selinux-policy-targeted policycoreutils \
              setools-console make
            cp /policy/* /tmp/ && cd /tmp
            make -f /usr/share/selinux/devel/Makefile blkbstr.pp
            semodule -n -i blkbstr.pp
            pol=/var/lib/selinux/targeted/active/policy.kern
            # The three transitions the daemon cannot work without.
            sesearch --type_trans -s init_t -t blkbstrd_exec_t -c process "$pol" | grep -q blkbstrd_t
            sesearch --type_trans -s blkbstrd_t -t iptables_exec_t -c process "$pol" | grep -q iptables_t
            sesearch -A -s blkbstrd_t -t blkbstrd_t -c netlink_netfilter_socket "$pol" | grep -q bind'
