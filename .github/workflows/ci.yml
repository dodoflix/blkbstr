name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; nothing here publishes anything.
permissions:
  contents: read

# A new push makes the previous run irrelevant. Without this they queue up and each one costs a
# full Tauri build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The portable crates. No system packages, so this reports quickly whatever the package mirrors
  # are doing — and it holds every test.
  #
  # Both platforms, because `blkbstr-daemon` has `#[cfg(unix)]` / `#[cfg(not(unix))]` branches for
  # the socket: the Windows named-pipe path is only compiled by the Windows leg.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p blkbstr-core -p blkbstr-daemon --all-targets -- -D warnings
      - run: cargo test -p blkbstr-core -p blkbstr-daemon

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # The GUI crate links against the platform webview, so this is the only job needing system
  # packages, and the only one that covers `-p blkbstr`.
  app:
    strategy:
      fail-fast: false
      matrix:
        # Target platforms only. macOS is not one: upstream has no macOS engine, so a build there
        # would prove nothing we ship. The BSDs have no hosted runner.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        # webkit2gtk pulls in gstreamer and a lot else, and azure.archive.ubuntu.com has served
        # it at ~40 kB/s: 6 minutes for 42 packages, measured. Generous bound so normal slowness
        # passes, but still bounded so a genuine hang fails instead of occupying a runner.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri embeds the built frontend, so it has to exist before the crate is compiled.
      - run: npm run build

      - run: cargo clippy -p blkbstr --all-targets -- -D warnings
      - run: cargo test -p blkbstr
