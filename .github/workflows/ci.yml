name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Nothing in CI debugs a test binary, and debuginfo is a large share of compile and link time.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # The portable crates, no system packages. Both platforms because `blkbstr-daemon` has
  # `#[cfg(unix)]` branches for the socket and only the Windows leg compiles the named-pipe path.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: cargo fmt --all -- --check
      - run: cargo clippy -p blkbstr-core -p blkbstr-daemon --all-targets -- -D warnings
      - run: cargo test -p blkbstr-core -p blkbstr-daemon

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  # The only job needing system packages (the GUI crate links the platform webview).
  app:
    strategy:
      fail-fast: false
      matrix:
        # No macOS: upstream has no macOS engine. The BSDs have no hosted runner.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        # webkit2gtk pulls in 179 packages; bounded so a dead mirror fails the job instead of hanging.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner's default mirror often returns nothing and costs minutes of retries.
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # tauri embeds the built frontend, so it must exist first.
      - run: npm run build

      # The Windows bundle config lists the daemon as a sidecar, and the build script refuses to
      # run without it.
      - name: Stage the daemon sidecar
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: packaging/windows/stage-daemon.ps1

      - run: cargo clippy -p blkbstr --all-targets -- -D warnings
      - run: cargo test -p blkbstr

  # A broken LSM profile is worse than none, and neither cargo nor npm checks the packaging.
  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer scripts parse
        run: for f in packaging/linux/install.sh packaging/linux/uninstall.sh scripts/*.sh .githooks/*; do sh -n "$f"; done

      - name: systemd unit parses
        run: |
          out=$(systemd-analyze verify packaging/linux/blkbstrd.service 2>&1 || true)
          # The daemon is not installed on a runner, so that complaint is expected. systemd exits 0
          # on directives it does not understand, so the output is what gets checked.
          noise=$(printf '%s\n' "$out" | grep -v 'is not executable' || true)
          [ -z "$noise" ] || { printf '%s\n' "$noise"; exit 1; }

      - name: Profiles agree with the installer on where the daemon lives
        run: |
          libexec=$(sed -n 's/^LIBEXEC=//p' packaging/linux/install.sh)
          grep -q "$libexec" packaging/linux/apparmor/usr.local.libexec.blkbstrd
          grep -q "$libexec" packaging/linux/selinux/blkbstr.fc

      - name: AppArmor profile parses
        # No apt step: ubuntu-latest already has apparmor. -Q parses without loading.
        run: apparmor_parser -Q -K packaging/linux/apparmor/usr.local.libexec.blkbstrd

      - name: SELinux module links against the targeted policy
        # In Fedora because that is where SELinux users are; linking catches a missing type or interface.
        run: |
          docker run --rm -v "$PWD/packaging/linux/selinux:/policy:ro" fedora:41 sh -c '
            set -eu
            dnf -q -y install selinux-policy-devel selinux-policy-targeted policycoreutils \
              setools-console make
            cp /policy/* /tmp/ && cd /tmp
            make -f /usr/share/selinux/devel/Makefile blkbstr.pp
            semodule -n -i blkbstr.pp
            pol=/var/lib/selinux/targeted/active/policy.kern
            # The three transitions the daemon cannot work without.
            sesearch --type_trans -s init_t -t blkbstrd_exec_t -c process "$pol" | grep -q blkbstrd_t
            sesearch --type_trans -s blkbstrd_t -t iptables_exec_t -c process "$pol" | grep -q iptables_t
            sesearch -A -s blkbstrd_t -t blkbstrd_t -c netlink_netfilter_socket "$pol" | grep -q bind'
