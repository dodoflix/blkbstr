name: Release

# Release Please keeps a release PR open on main; merging it tags the release and the job below
# attaches the Linux artefacts.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Linux only until there is a Windows service to install.
  linux:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      # For the provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner's default mirror often returns nothing and costs minutes of retries.
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: npm ci
      # `tauri build` runs `npm run build` itself via beforeBuildCommand.
      - run: npm run tauri build
      - run: cargo build --release -p blkbstr-daemon

      - name: Collect the artefacts
        run: |
          mkdir -p dist
          cp target/release/blkbstrd dist/
          find target/release/bundle -type f \
            \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' \) -exec cp {} dist/ \;
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      # Keyless Sigstore attestation: ties each file to this run and commit with no key to lose.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/blkbstrd
            dist/*.deb
            dist/*.rpm
            dist/*.AppImage

      - name: Attach the artefacts and how to verify them to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          cat >> notes.md <<'EOF'

          ### Checking what you downloaded

          Anti-censorship tools are an obvious thing to impersonate, so do not take a download page
          at its word. Every binary below carries a signed provenance attestation naming the commit
          and workflow run that built it:

          ```sh
          gh attestation verify blkbstrd -R dodoflix/blkbstr
          ```

          `SHA256SUMS` covers the same files:

          ```sh
          sha256sum -c SHA256SUMS
          ```

          The zapret2 engine is not in here and is versioned separately: Blockbuster drives
          whichever one you have installed.
          EOF
          gh release edit "$TAG" --notes-file notes.md
          gh release upload "$TAG" dist/* --clobber
