name: Release

# Release Please keeps a release PR open on main; merging it tags a draft release and the jobs below
# attach the Linux and Windows builds, checksum, sign and publish the package repositories, send the
# Windows installer to VirusTotal, and only then make the release public.
on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  linux:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux dependencies
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # The runner's default mirror often returns nothing and costs minutes of retries.
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: npm ci
      # The deb and rpm carry blkbstrd (src-tauri/tauri.linux.conf.json), so it is built first.
      - run: cargo build --release -p blkbstr-daemon
      # `tauri build` runs `npm run build` itself via beforeBuildCommand.
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Attach the packages to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          files=(target/release/blkbstrd)
          while IFS= read -r f; do files+=("$f"); done < <(
            find target/release/bundle -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.AppImage.sig' \))
          gh release upload "$TAG" "${files[@]}" --clobber

  windows:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - run: packaging/windows/stage-daemon.ps1 -Profile release
      - run: npm ci
      # `tauri build` runs `npm run build` itself via beforeBuildCommand.
      - run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: gh release upload $env:TAG (Get-ChildItem target/release/bundle/nsis/*-setup.exe*).FullName --clobber

  # The app's updater reads latest.json from the latest release; it needs both signatures, so it
  # runs after both builds.
  updater-manifest:
    needs: [release-please, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir sigs
          linux=$(basename sigs/*.AppImage.sig .sig)
          windows=$(basename sigs/*-setup.exe.sig .sig)
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n --arg v "${TAG#v}" --arg base "$base" \
            --arg l "$linux" --arg ls "$(cat "sigs/$linux.sig")" \
            --arg w "$windows" --arg ws "$(cat "sigs/$windows.sig")" \
            '{version: $v, pub_date: (now | todate), platforms: {
               "linux-x86_64": {signature: $ls, url: "\($base)/\($l)"},
               "windows-x86_64": {signature: $ws, url: "\($base)/\($w)"}}}' > latest.json
          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

  # Checksums, signatures and the apt and dnf repositories are made from whatever the builds above
  # attached, so an installer that gets signed in its own job is covered without changes here.
  publish:
    needs: [release-please, linux, windows, updater-manifest]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag }}
      GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Import the signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Download the release assets
        run: |
          gh release download "$TAG" --dir assets --clobber
          rm -f assets/SHA256SUMS assets/SHA256SUMS.asc
      - name: Checksum and sign
        run: |
          (cd assets && sha256sum -- * > ../SHA256SUMS)
          mv SHA256SUMS assets/
          gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
            --armor --detach-sign assets/SHA256SUMS
          gh release upload "$TAG" assets/SHA256SUMS assets/SHA256SUMS.asc --clobber
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: assets/*
      - name: Build the apt and dnf repositories
        run: |
          echo 'http://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 apt-utils createrepo-c
          scripts/linux-repos.sh assets site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # VirusTotal shares every new file with the antivirus vendors, Microsoft among them, so Defender's
  # cloud has the installer before anyone downloads it. Without the VT_API_KEY secret this is skipped.
  virustotal:
    needs: [release-please, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      status: ${{ steps.scan.outputs.status || 'skipped' }}
      sha256: ${{ steps.scan.outputs.sha256 }}
      microsoft: ${{ steps.scan.outputs.microsoft }}
      microsoft_result: ${{ steps.scan.outputs.microsoft_result }}
      flagged: ${{ steps.scan.outputs.flagged }}
      detections: ${{ steps.scan.outputs.detections }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-setup.exe' --dir vt
          scripts/virustotal.sh vt/*-setup.exe | tee -a "$GITHUB_OUTPUT" "$GITHUB_STEP_SUMMARY"

  # The release goes public only when Microsoft's engine did not flag the installer. A flagged one
  # stays a draft, so the download page and the updater keep the previous release, and an issue says
  # what to submit to Microsoft (docs/av-submission.md).
  go-live:
    needs: [release-please, publish, virustotal]
    # A failed scan still reaches the hold branch below, so the release never stays a draft silently.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag }}
      STATUS: ${{ needs.virustotal.outputs.status }}
      SHA256: ${{ needs.virustotal.outputs.sha256 }}
      MICROSOFT: ${{ needs.virustotal.outputs.microsoft }}
      MICROSOFT_RESULT: ${{ needs.virustotal.outputs.microsoft_result }}
      FLAGGED: ${{ needs.virustotal.outputs.flagged }}
      DETECTIONS: ${{ needs.virustotal.outputs.detections }}
    steps:
      # Users can see what antivirus engines made of the installer, and a later flag reads as one
      # engine changing its mind, not as a different file.
      - name: Add the VirusTotal result to the release notes
        if: ${{ needs.virustotal.outputs.status == 'completed' }}
        # Nice to have: a failure here must not stop the publish-or-hold decision below.
        continue-on-error: true
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          cat >> notes.md <<EOF

          ### VirusTotal

          Scanned before release. Microsoft Defender: \`$MICROSOFT\`. [$DETECTIONS engines on VirusTotal](https://www.virustotal.com/gui/file/$SHA256) flagged it${FLAGGED:+ ($FLAGGED)}. SHA-256: \`$SHA256\`.

          The installer is not code-signed, so a few machine-learning engines flag it on sight; these are known false positives, see [docs/av-submission.md](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/av-submission.md#what-to-tell-a-user-whose-antivirus-blocked-it).
          EOF
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
      - name: Publish the release, or hold it for Microsoft
        run: |
          # Only an explicit clean verdict publishes: a missing, timed-out or unsupported Microsoft
          # result means nothing was checked.
          if [ "$STATUS" = skipped ] || { [ "$STATUS" = completed ] && { [ "$MICROSOFT" = undetected ] || [ "$MICROSOFT" = harmless ]; }; }; then
            [ "$STATUS" = skipped ] && echo "::warning::VT_API_KEY is not set; publishing without the VirusTotal check."
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
            exit 0
          fi
          case "$STATUS/$MICROSOFT" in
            completed/malicious | completed/suspicious)
              why="Microsoft's engine on VirusTotal flags the installer as \`$MICROSOFT_RESULT\`." ;;
            completed/*)
              why="Microsoft's engine on VirusTotal gave no verdict (\`$MICROSOFT\`)." ;;
            *)
              why="The VirusTotal check did not finish (timed out or failed; see the workflow run)." ;;
          esac
          body=$(cat <<EOF
          $why The release stays a draft, so the download page and the app's updater keep the previous version.

          - Installer SHA-256: \`$SHA256\`
          - VirusTotal: https://www.virustotal.com/gui/file/$SHA256
          - Every engine that flagged it: ${FLAGGED:-none}

          1. Submit the installer at https://www.microsoft.com/en-us/wdsi/filesubmission as a software developer, choosing "Incorrectly detected as malware".
          2. Once Defender no longer flags it (docs/av-submission.md), publish: \`gh release edit $TAG --draft=false --latest\`
          EOF
          )
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TAG is held: the Windows installer did not pass the VirusTotal check" --body "$body"

  pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  aur:
    needs: [release-please, linux, go-live]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false
      - name: Publish blkbstr-bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag }}
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          gh release download "$TAG" --pattern '*_amd64.deb' --dir assets
          scripts/publish-aur.sh packaging/linux/aur/PKGBUILD.in blkbstr-bin assets/*.deb
