<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2140"/>
      <stop offset="100%" stop-color="#2A3163"/>
    </linearGradient>
    <linearGradient id="blockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6F7FC"/>
      <stop offset="100%" stop-color="#DDE1F0"/>
    </linearGradient>
    <linearGradient id="burstGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9466"/>
      <stop offset="100%" stop-color="#E85A2A"/>
    </linearGradient>
  </defs>

  <!-- Badge background -->
  <rect x="0" y="0" width="256" height="256" rx="56" fill="url(#bgGrad)"/>

  <!-- Motion trail from the gap toward the escaping block -->
  <g stroke="#FF7A45" stroke-linecap="round" fill="none">
    <line x1="148" y1="102" x2="158" y2="72" stroke-width="7" opacity="0.18"/>
    <line x1="163" y1="106" x2="171" y2="76" stroke-width="6" opacity="0.28"/>
    <line x1="178" y1="108" x2="184" y2="80" stroke-width="5" opacity="0.4"/>
  </g>

  <!-- Empty socket where the block used to be -->
  <rect x="134" y="54" width="68" height="68" rx="12" fill="none"
        stroke="#4A5280" stroke-width="3" stroke-dasharray="7 7" opacity="0.6"/>

  <!-- Remaining wall blocks -->
  <rect x="54" y="54" width="68" height="68" rx="12" fill="url(#blockGrad)"/>
  <rect x="54" y="134" width="68" height="68" rx="12" fill="url(#blockGrad)"/>
  <rect x="134" y="134" width="68" height="68" rx="12" fill="url(#blockGrad)"/>

  <!-- Small debris near the socket -->
  <rect x="122" y="118" width="12" height="12" rx="3" fill="#FF7A45" opacity="0.7"
        transform="rotate(24 128 124)"/>
  <rect x="196" y="96" width="9" height="9" rx="2" fill="#FF7A45" opacity="0.5"
        transform="rotate(-12 200 100)"/>

  <!-- The escaping block -->
  <g transform="rotate(-18 184 52)">
    <rect x="150" y="18" width="68" height="68" rx="12" fill="url(#burstGrad)"/>
    <rect x="156" y="24" width="26" height="10" rx="5" fill="#FFFFFF" opacity="0.22"/>
    <path d="M172 18 L180 39 L164 53 L184 86" fill="none"
          stroke="#B8431B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
