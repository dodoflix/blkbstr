[package]
name = "blkbstr-daemon"
description = "Privileged helper that owns the zapret2 engine and the firewall rules."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "blkbstrd"
path = "src/main.rs"

[dependencies]
blkbstr-core = { workspace = true }
anyhow = { workspace = true }
interprocess = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(any(target_os = "linux", windows))'.dependencies]
# SO_MARK (Linux) and the TTL set before connecting (Windows), so the periodic check can probe
# without the strategy; std can set neither before the first packet leaves.
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
flate2 = { workspace = true }
tar = { workspace = true }
signal-hook = { workspace = true }

[target.'cfg(windows)'.dependencies]
widestring = { workspace = true }
windows-service = { workspace = true }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
zip = { workspace = true }

[dev-dependencies]
zip = { workspace = true }
