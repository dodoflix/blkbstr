[workspace]
resolver = "2"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/dodoflix/blkbstr"
rust-version = "1.82"

[workspace.dependencies]
blkbstr-core = { path = "crates/blkbstr-core" }

anyhow = "1"
signal-hook = { version = "0.4", default-features = false, features = ["iterator"] }
directories = "6"
flate2 = "1"
interprocess = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
widestring = "1"
windows-service = "0.8"
windows-sys = { version = "0.61", default-features = false }
# 2.x: later majors need a newer rustc than rust-version above.
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
